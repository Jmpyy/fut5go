name: Fut5Go CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-and-test:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify Project Architecture & Docs
        run: |
          echo "Verifying project structure and documentation..."
          test -d apps/frontend || exit 1
          test -d apps/backend || exit 1
          test -d database || exit 1
          test -d docker || exit 1
          test -f README.md || exit 1
          test -f docs/ARCHITECTURE.md || exit 1
          test -f docs/DATABASE_DESIGN.md || exit 1
          test -f docs/ROLES_AND_WORKFLOW.md || exit 1
          echo "Project structure verified successfully!"

      - name: Install dependencies (Workspaces)
        run: npm ci

      - name: Validate Configurations
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json'))"
          node -e "JSON.parse(require('fs').readFileSync('apps/frontend/package.json'))"
          node -e "JSON.parse(require('fs').readFileSync('apps/backend/package.json'))"
          echo "All JSON configurations are valid."
